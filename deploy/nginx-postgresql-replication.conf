# PostgreSQL replication uses its native TCP protocol. PostgreSQL terminates
# optional TLS; nginx only forwards the byte stream to the loopback-only server.
limit_conn_zone $binary_remote_addr zone=pg_replication_per_ip:10m;

server {
    listen 0.0.0.0:6311;

    # Initial base backup uses a second connection for streaming WAL.
    limit_conn pg_replication_per_ip 4;
    proxy_connect_timeout 5s;
    proxy_timeout 7d;
    proxy_socket_keepalive on;
    proxy_pass 127.0.0.1:5432;
}
