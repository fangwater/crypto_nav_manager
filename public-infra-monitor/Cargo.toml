[package]
name = "public-infra-monitor"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
publish = false
build = "build.rs"

[features]
default = []
bpf = ["dep:libbpf-rs"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
libbpf-rs = { version = "0.26.2", optional = true }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
